# Los gates, en un solo lugar, para que el CI y la release corran LOS MISMOS.
#
# POR QUÉ EXISTE. release.yml decía en su cabecera «corre los MISMOS gates que
# el CI, porque un tag no es motivo para confiar más que un push», y no era
# cierto: tenía su propio job `gates` con cinco pasos —typecheck, test,
# el-paquete-de-npm-corre.sh, gate-npm-rojo y gate-paquetes.sh— mientras el CI
# corría esos y ocho más. gate-dibujo, gate-cambios, gate-duraciones,
# gate-lazo, gate-presupuesto, gate-calentado, gate-winget-rojo y
# gate-paquetes-rojo NO miraban un tag. Un push a main estaba mejor comprobado
# que la versión que se publica, que es exactamente al revés de lo que hay que
# hacer. (gate-bandeja y gate-windows sí corrían, sueltos en el job `windows`:
# otra copia, y la encontró gate-copias.)
#
# La copia no se desincronizó por descuido: se desincroniza sola. Cada gate
# nuevo se agrega donde duele —el CI— y el job de la release se queda como
# estaba, en verde, sin que nada lo señale. Por eso el arreglo no es «agregar
# los ocho que faltan» sino sacar la segunda copia: los dos workflows llaman
# acá, y un gate nuevo entra a los dos porque no hay dos lugares donde entrar.
#
# Y esto no es gratis: la release pasa de ~20 s de gates a ~85 s, porque ahora
# espera al job de Windows. Ese minuto es el precio de que el .exe que se
# publica haya compilado con el mismo gate que compila en cada push. Barato.
#
# No lleva secretos a propósito. `make gate-winget-rojo` comprueba los caminos
# que NO mandan nada (sin token, sin versión, con un token muerto), así que
# corre con el token vacío: pasarle uno de verdad comprobaría otra cosa.
name: gates
on:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'   # >= 22.6: scripts/nodo.cjs lo verifica igual
      - run: npm install
      - run: npm run typecheck
      - run: npm test

      # La versión vive en siete lugares (package.json, el PKGBUILD, el
      # .SRCINFO, el version-name de la extensión, las dos landings y los
      # manifests). Editar seis no rompe nada visible acá: rompe del otro lado,
      # en un catálogo con una persona esperando.
      - run: ./scripts/gate-paquetes.sh
      # Y que ese gate sepa fallar. El pie de las landings entró tarde al gate:
      # docs/es/index.html anunció v0.1.2 durante cuatro releases con el resto en
      # 0.1.6 y esto en verde, porque sólo se miraba el nombre del instalador.
      - name: y ese gate falla en rojo con una landing vieja
        run: make gate-paquetes-rojo

      # `npm test` corre el TypeScript DESDE EL FUENTE, que es justo el caso
      # que no se parece a un `npm install -g`: ahí el paquete cae bajo
      # node_modules y Node se niega a hacer type stripping. El verde de arriba
      # convivió con un paquete que reventaba en cada invocación.
      # El envío a winget ya mintió una vez: dijo "PR mandado" sobre un submit
      # que había fallado. Esto comprueba que los tres caminos que no mandan
      # nada —sin token, sin versión, con un token muerto— salgan en rojo.
      - run: make gate-winget-rojo

      - name: el paquete de npm se instala y corre
        run: ./scripts/el-paquete-de-npm-corre.sh
      - name: y ese gate falla en rojo sin dist/
        run: make gate-npm-rojo

      # Que este archivo siga siendo el único. La copia recortada de la release
      # no la hizo nadie a propósito: se desincronizó sola durante quince
      # versiones, en verde. Arreglarla una vez no impide que vuelva.
      - run: make gate-copias
      - name: y ese gate falla en rojo con la copia de vuelta
        run: make gate-copias-rojo

  # El panel y el item de GNOME son Python + Cairo, y la extensión es JavaScript:
  # nada de eso lo toca `npm test`. Sin este job, borrar medio bin/qm-indicator
  # deja el CI en verde — ya pasó.
  dibujo:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: dependencias de dibujo
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi python3-gi-cairo python3-cairo \
            gir1.2-gtk-3.0 gir1.2-ayatanaappindicator3-0.1 \
            fonts-cantarell
      - run: ./scripts/gate-dibujo.sh
        env:
          QM_GATE_EXIGE_PWSH: '1'   # el runner de Ubuntu lo trae; saltearlo acá sería un adorno
          QM_GATE_EXIGE_SWIFT: '1'  # y Swift también: la barra de macOS se parsea acá

      # Y que ese gate sepa fallar. Era el ÚNICO `-rojo` que no corría acá: los
      # otros ocho sí, y CONTRIBUTING pide que todo gate esté probado en rojo
      # («a test that has never failed proves nothing»). O sea que gate-dibujo
      # podía dejar de comprobar lo que dice comprobar y el CI seguía verde.
      # Se notó agregándole el quinto chequeo, el del sello: su rojo existía
      # sólo en la máquina de quien lo escribió.
      - name: y ese gate falla en rojo
        run: make gate-dibujo-rojo
      # El runner de Ubuntu trae Swift Y PowerShell, así que las cuatro
      # implementaciones se comprueban acá. Se llegó a agregar un job de macOS
      # para Swift antes de mirar qué había en el de Ubuntu: sobraba, y encima
      # fallaba porque ahí no está el cairo que necesita el panel de GNOME.
      - name: la página de cambios es la del CHANGELOG
        run: make gate-cambios
      - name: y ese gate falla en rojo con el CHANGELOG movido
        run: make gate-cambios-rojo

      - run: python3 scripts/gate-duraciones.py

      # Y la otra regla escrita cinco veces: la frase del presupuesto. 0.1.11
      # tuvo que arreglar el mismo doble descuento en las cinco pantallas y nada
      # comprobaba que siguieran leyendo la resta hecha — volver a ponerlo en
      # bin/qm-indicator dejaba gate-dibujo, gate-tarjetas y los 148 tests en
      # verde. Va en este job y no en `check` porque acá está todo junto: el
      # cairo que el indicador necesita para importarse, el Swift de la barra y
      # el PowerShell de la bandeja.
      # Que el calentado no pueda dejar de ocurrir en silencio. 0.1.13 tuvo
      # siete horas y media sin una línea con el proceso vivo: el lazo se
      # rearmaba desde un solo lugar y había un estado que rearmaba callado.
      - run: make gate-lazo
        env:
          QM_GATE_EXIGE: swift   # el runner lo trae: el vigía de macOS se CORRE, no se compila nomás
      - name: y ese gate falla en rojo con el silencio de vuelta
        run: make gate-lazo-rojo

      - run: make gate-presupuesto
        env:
          QM_GATE_EXIGE: swift,pwsh,cairo
      - name: y ese gate falla en rojo con el doble descuento de vuelta
        run: make gate-presupuesto-rojo
        env:
          QM_GATE_EXIGE: swift,pwsh,cairo

      # A quién se le pregunta en el próximo calentado. La cuenta frenada
      # quedaba fuera de todos los calentados por un `< 100`, así que la única
      # que no podía enterarse de que se liberó era justo la que esperaba
      # liberarse.
      - run: make gate-calentado
      - name: y ese gate falla en rojo
        run: make gate-calentado-rojo
        env:
          QM_GATE_EXIGE: swift,pwsh,cairo

      # Que el zip de la extensión salga con la forma que pide
      # extensions.gnome.org: los tres archivos en la RAÍZ, el uuid igual al
      # directorio y sin "version" en el metadata.json (ese número lo pone el
      # sitio). Sin esto, el error se descubre subiendo — y ahí del otro lado
      # hay una persona esperando.
      # shexli es el analizador que recomienda extensions.gnome.org. La primera
      # vez que se corrió encontró dos cosas que la revisión marca, una de
      # ellas la causa de rechazo más común del sitio. Acá lo corre el gate.
      - run: pipx install shexli || pip install --user -U shexli
      - run: ./scripts/hacer-extension-zip.sh
      - uses: actions/upload-artifact@v6
        with:
          name: extension-gnome
          path: dist/*.shell-extension.zip
          if-no-files-found: error

  # La bandeja DIBUJA con System.Drawing y WinForms, que son de Windows: parsear
  # se puede en Ubuntu (lo hace gate-dibujo.sh) pero comprobar que salga un panel
  # de 340 px con píxeles adentro, en los dos temas, sin nada fuera del margen y
  # con un panel distinto por ícono, necesita un Windows de verdad.
  #
  # Va con `powershell` y no con `pwsh` a propósito: es Windows PowerShell 5.1,
  # que es lo que hay en una máquina sin instalar nada y por lo tanto lo que
  # corre el usuario. Un gate contra pwsh 7 comprobaría un intérprete que la
  # bandeja no usa.
  bandeja:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/gate-bandeja.ps1

      # El mismo gate que corre en Ubuntu, pero acá agarra la pantalla que allá
      # se saltea: RenglonesPresupuesto se EJECUTA, con el Windows PowerShell 5.1
      # de verdad, contra el mismo canon que el núcleo, GNOME y el tablero.
      - run: python scripts/gate-presupuesto.py

      # Windows como PLATAFORMA, que es otra cosa que la bandeja como dibujo.
      # El job de arriba comprueba que `npm install -g` deje un qm que corre en
      # Linux; este comprueba lo mismo en Windows, que es donde estaba roto:
      # npm arma el shim a partir del shebang, `bin/qm` es un #!/bin/sh, y el
      # .cmd generado invocaba `sh` — que no está en el PATH de una máquina con
      # Git for Windows instalado de la forma normal.
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/gate-windows.ps1

      # Y que el instalador COMPILE. Un .iss roto no se nota hasta el día de la
      # release, que es el peor día para enterarse.
      - run: choco install innosetup -y --no-progress
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/hacer-setup.ps1
      - uses: actions/upload-artifact@v6
        with:
          name: instalador-windows
          path: dist/*-setup.exe
          if-no-files-found: error
