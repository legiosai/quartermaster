# ¿Alguien instaló esto? Una vez por día, a docs/descargas.json.
#
# Los contadores públicos —npm y los adjuntos de cada release— cuentan sobre
# todo lo nuestro: los mirrors bajan cada versión nueva y release.yml baja el
# instalador para el hash de winget. scripts/descargas.mjs resta eso y deja
# un número.
#
# Y mide el INTERÉS, que es la otra mitad: visitas, de dónde vienen, estrellas,
# y los clones del tap y del bucket. Hizo falta porque el tablero medía sólo
# descargas y con eso el día del anuncio —21 visitantes únicos, tres estrellas
# de gente desconocida— se leía «npm 0», igual que un día sin nada. Y porque el
# CTA principal es `brew install`, que es justo el canal que no tiene contador. Como los adjuntos de GitHub son acumulados, «esta semana» sólo
# existe si alguien anota lo que decían ayer: eso es esta corrida diaria.
#
# Comitea a main sólo si el JSON cambió. Es el mismo permiso con el que
# release.yml crea la release; main no está protegida.
name: descargas
on:
  workflow_dispatch:
  schedule:
    # Al mediodía UTC: npm cierra el día anterior de madrugada, así que a esta
    # hora el número de ayer ya está.
    - cron: '0 12 * * *'

permissions:
  contents: write

jobs:
  contar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: bajar los números
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # La API de tráfico —visitas, referentes, clones— pide permiso de
          # PUSH, y eso el GITHUB_TOKEN del workflow no lo da: `administration`
          # ni siquiera es una clave válida en `permissions:` (se intentó, y el
          # workflow entero quedó inválido con un run de 0 s). O sea que las dos
          # mitades nuevas necesitan un PAT, no el token del job.
          #
          # Y el tap de Homebrew y el bucket de scoop son OTROS repos, donde el
          # token del workflow no llega de ninguna manera.
          #
          # Sin el PAT, esas secciones quedan en null CON EL MOTIVO escrito y el
          # conteo de npm y de los adjuntos sigue igual: lo que no se pudo leer
          # no puede parecerse a un cero.
          TOKEN_PAQUETES: ${{ secrets.TOKEN_PAQUETES }}
        run: node scripts/descargas.mjs
      - name: comitear si cambió
        run: |
          if git diff --quiet -- docs/descargas.json; then
            echo "sin cambios"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/descargas.json
          git commit -m "descargas: $(date -u +%F)"
          git push
