name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # >= 22.6: scripts/nodo.cjs lo verifica igual
      - run: npm install
      - run: npm run typecheck
      - run: npm test

      # La versión vive en siete lugares (package.json, el PKGBUILD, el
      # .SRCINFO, el version-name de la extensión, las dos landings y los
      # manifests). Editar seis no rompe nada visible acá: rompe del otro lado,
      # en un catálogo con una persona esperando.
      - run: ./scripts/gate-paquetes.sh
      # Y que ese gate sepa fallar. El pie de las landings entró tarde al gate:
      # docs/es/index.html anunció v0.1.2 durante cuatro releases con el resto en
      # 0.1.6 y esto en verde, porque sólo se miraba el nombre del instalador.
      - name: y ese gate falla en rojo con una landing vieja
        run: make gate-paquetes-rojo

      # `npm test` corre el TypeScript DESDE EL FUENTE, que es justo el caso
      # que no se parece a un `npm install -g`: ahí el paquete cae bajo
      # node_modules y Node se niega a hacer type stripping. El verde de arriba
      # convivió con un paquete que reventaba en cada invocación.
      - name: el paquete de npm se instala y corre
        run: ./scripts/el-paquete-de-npm-corre.sh
      - name: y ese gate falla en rojo sin dist/
        run: make gate-npm-rojo

  # El panel y el item de GNOME son Python + Cairo, y la extensión es JavaScript:
  # nada de eso lo toca `npm test`. Sin este job, borrar medio bin/qm-indicator
  # deja el CI en verde — ya pasó.
  dibujo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: dependencias de dibujo
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi python3-gi-cairo python3-cairo \
            gir1.2-gtk-3.0 gir1.2-ayatanaappindicator3-0.1 \
            fonts-cantarell
      - run: ./scripts/gate-dibujo.sh
        env:
          QM_GATE_EXIGE_PWSH: '1'   # el runner de Ubuntu lo trae; saltearlo acá sería un adorno
          QM_GATE_EXIGE_SWIFT: '1'  # y Swift también: la barra de macOS se parsea acá
      # El runner de Ubuntu trae Swift Y PowerShell, así que las cuatro
      # implementaciones se comprueban acá. Se llegó a agregar un job de macOS
      # para Swift antes de mirar qué había en el de Ubuntu: sobraba, y encima
      # fallaba porque ahí no está el cairo que necesita el panel de GNOME.
      - run: python3 scripts/gate-duraciones.py

      # A quién se le pregunta en el próximo calentado. La cuenta frenada
      # quedaba fuera de todos los calentados por un `< 100`, así que la única
      # que no podía enterarse de que se liberó era justo la que esperaba
      # liberarse.
      - run: make gate-calentado
      - name: y ese gate falla en rojo
        run: make gate-calentado-rojo
        env:
          QM_GATE_EXIGE: swift,pwsh

      # Que el zip de la extensión salga con la forma que pide
      # extensions.gnome.org: los tres archivos en la RAÍZ, el uuid igual al
      # directorio y sin "version" en el metadata.json (ese número lo pone el
      # sitio). Sin esto, el error se descubre subiendo — y ahí del otro lado
      # hay una persona esperando.
      - run: ./scripts/hacer-extension-zip.sh
      - uses: actions/upload-artifact@v4
        with:
          name: extension-gnome
          path: dist/*.shell-extension.zip
          if-no-files-found: error

  # La bandeja DIBUJA con System.Drawing y WinForms, que son de Windows: parsear
  # se puede en Ubuntu (lo hace gate-dibujo.sh) pero comprobar que salga un panel
  # de 340 px con píxeles adentro, en los dos temas, sin nada fuera del margen y
  # con un panel distinto por ícono, necesita un Windows de verdad.
  #
  # Va con `powershell` y no con `pwsh` a propósito: es Windows PowerShell 5.1,
  # que es lo que hay en una máquina sin instalar nada y por lo tanto lo que
  # corre el usuario. Un gate contra pwsh 7 comprobaría un intérprete que la
  # bandeja no usa.
  bandeja:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/gate-bandeja.ps1

      # Windows como PLATAFORMA, que es otra cosa que la bandeja como dibujo.
      # El job de arriba comprueba que `npm install -g` deje un qm que corre en
      # Linux; este comprueba lo mismo en Windows, que es donde estaba roto:
      # npm arma el shim a partir del shebang, `bin/qm` es un #!/bin/sh, y el
      # .cmd generado invocaba `sh` — que no está en el PATH de una máquina con
      # Git for Windows instalado de la forma normal.
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/gate-windows.ps1

      # Y que el instalador COMPILE. Un .iss roto no se nota hasta el día de la
      # release, que es el peor día para enterarse.
      - run: choco install innosetup -y --no-progress
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/hacer-setup.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: instalador-windows
          path: dist/*-setup.exe
          if-no-files-found: error
