name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # >= 22.6: scripts/nodo.cjs lo verifica igual
      - run: npm install
      - run: npm run typecheck
      - run: npm test
