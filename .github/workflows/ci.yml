# El CI: los gates de .github/workflows/gates.yml, en cada push y cada PR.
#
# Los gates VIVÍAN acá y la release tenía su propia copia recortada. Están en
# gates.yml para que haya uno solo: lo que corre en un push es, literalmente,
# lo que corre en un tag. La razón larga está en la cabecera de ese archivo.
name: ci
on: [push, pull_request]

jobs:
  gates:
    uses: ./.github/workflows/gates.yml
