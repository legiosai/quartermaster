name: Something else / Otra cosa
description: A crash, a surface that does not draw, an install that fails
body:
  - type: textarea
    id: que
    attributes:
      label: What happened / Qué pasó
      description: Y qué esperabas que pasara. **English or Spanish.**
    validations:
      required: true
  - type: textarea
    id: reproducir
    attributes:
      label: How to reproduce / Cómo reproducirlo
    validations:
      required: true
  - type: textarea
    id: entorno
    attributes:
      label: Environment / Entorno
      description: >-
        Pegá la salida de `qm --diagnostico`. Trae versión, sistema, escritorio,
        el estado de las superficies y lo que anotó el sistema — y ya viene
        redactado: sin rutas de casa, sin mails y sin tokens.
        / Paste the output of `qm --diagnostico`. It is already redacted.
      render: text
      placeholder: "$ qm --diagnostico"
    validations:
      required: true
