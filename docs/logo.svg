<!-- quartermaster.
     Un medidor circular al que le falta un cuarto, que además es una Q: el
     hueco es lo consumido y la cola cierra la letra. El arco va de verde a
     rojo porque es literalmente lo que hace el programa — no es decoración,
     es la escala. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="quartermaster">
  <defs>
    <linearGradient id="qm" gradientUnits="userSpaceOnUse" x1="14" y1="46" x2="50" y2="14">
      <stop offset="0" stop-color="#2fbf71"/>
      <stop offset=".5" stop-color="#f2b134"/>
      <stop offset="1" stop-color="#e2483d"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="20" fill="none" stroke="currentColor" stroke-opacity=".14" stroke-width="9"/>
  <path d="M32 12A20 20 0 1 1 14.8 42" fill="none" stroke="url(#qm)" stroke-width="9" stroke-linecap="round"/>
  <path d="M41 41 51.5 51.5" fill="none" stroke="url(#qm)" stroke-width="9" stroke-linecap="round"/>
</svg>
